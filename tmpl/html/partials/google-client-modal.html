<div class="modal fade" id="googleClientSetupModal" tabindex="-1"
     aria-labelledby="googleClientSetupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="googleClientSetupModalLabel">
                    <i class="bi bi-upload me-2"></i>Upload Google Client ID
                </h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Select the JSON credentials file for a Google OAuth <strong>Desktop app</strong>.</p>
                <form id="google-client-import-form" method="post"
                      action="/setup/google-client/import" enctype="multipart/form-data">
                    <label for="googleClientCredentials" class="form-label">Google OAuth credentials JSON</label>
                    <input class="form-control" type="file" id="googleClientCredentials"
                           name="credentials" accept=".json,application/json" required>
                    <div class="alert alert-secondary mt-3 mb-0">
                        <i class="bi bi-shield-lock me-1"></i>
                        BOREAL stores the credentials locally in its private configuration directory as
                        <code>google-client.json</code>.
                    </div>
                </form>
                <p class="small text-body-secondary mt-3 mb-0">
                    Don’t have a Desktop app credentials file?
                    <a href="/google-client">Follow the Google Client ID creation wizard</a>.
                </p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary" form="google-client-import-form">
                    <i class="bi bi-upload me-1"></i>Upload Client ID
                </button>
            </div>
        </div>
    </div>
</div>
