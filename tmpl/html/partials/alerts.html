{% if alerts.len() > 0 %}

<div
    id="boreal-alerts"
    class="border-bottom bg-body-secondary"
    {% if poll_rclone %}
    hx-get="/ui/alerts"
    hx-trigger="every 1s"
    hx-swap="outerHTML"
    {% endif %}
>

    <div
        class="container-fluid py-2 d-flex align-items-center flex-wrap gap-2"
    >

        <span
            class="small fw-semibold text-body me-1"
        >
            <i class="bi bi-exclamation-triangle me-1"></i>
            Alerts
        </span>

        {% for alert in alerts %}

        {% if alert.dismiss_action.len() > 0 %}

        <span class="badge text-bg-{{ alert.level }} d-inline-flex align-items-center gap-1">
            <span><i class="bi {{ alert.icon }} me-1"></i>{{ alert.message }}</span>
            <button class="btn-close btn-close-white ms-1" type="button"
                    style="font-size: .55rem" aria-label="Dismiss bookmark reminder"
                    hx-post="{{ alert.dismiss_action }}" hx-target="#boreal-alerts" hx-swap="outerHTML"></button>
        </span>

        {% else if alert.modal_target.len() > 0 %}

        <button
            type="button"
            class="badge text-bg-{{ alert.level }} border-0 d-inline-flex align-items-center"
            data-bs-toggle="modal"
            data-bs-target="#{{ alert.modal_target }}"
        >
            <i class="bi {{ alert.icon }} me-1"></i>
            {{ alert.message }}
        </button>

        {% else %}

        <span
            class="badge text-bg-{{ alert.level }} d-inline-flex align-items-center"
        >
            <i class="bi {{ alert.icon }} me-1"></i>
            {{ alert.message }}
        </span>

        {% endif %}

        {% endfor %}

    </div>

</div>

{% else %}

<div id="boreal-alerts"></div>

{% endif %}
