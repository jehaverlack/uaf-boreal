<span class="small text-body d-inline-flex align-items-center" data-status-label="Migrations"
      hx-get="/ui/migration-status-item" hx-trigger="every 2s" hx-swap="outerHTML">
    {% if item.spinner %}
    <span class="spinner-border spinner-border-sm text-primary me-1" role="status" aria-hidden="true"></span>
    {% else %}
    <i class="bi {{ item.icon }} me-1"></i>
    {% endif %}
    <span class="fw-semibold me-1">{{ item.label }}:</span>
    <a class="{{ item.value_class }}" href="{{ item.value_url }}" title="{{ item.title }}">{{ item.value }}</a>
</span>
