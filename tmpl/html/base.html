<!doctype html>

<html
    lang="en"
    data-bs-theme="light"
>

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>{{ title }}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Main application navigation -->
    <nav
        class="navbar navbar-expand-lg bg-body-tertiary border-bottom"
    >

        <div class="container-fluid">

            <a
                class="navbar-brand fw-semibold"
                href="/"
            >
                <i class="bi bi-folder-symlink me-2"></i>
                BOREAL
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#borealNavbar"
                aria-controls="borealNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="borealNavbar"
            >

                <ul
                    class="navbar-nav me-auto mb-2 mb-lg-0"
                >

                    <li class="nav-item">

                        <a
                            class="nav-link{% if active_page == "dashboard" %} active{% endif %}"
                            {% if active_page == "dashboard" %}
                            aria-current="page"
                            {% endif %}
                            href="/"
                        >
                            Dashboard
                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link{% if active_page == "rclone" %} active{% endif %}"
                            href="/rclone"
                        >
                            Rclone
                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link{% if active_page == "drives" %} active{% endif %}"
                            href="/drives"
                        >
                            Drives
                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link{% if active_page == "explorer" %} active{% endif %}"
                            href="/explorer"
                        >
                            Explorer
                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link{% if active_page == "sharing" %} active{% endif %}"
                            href="/sharing"
                        >
                            Sharing
                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link{% if active_page == "migration" %} active{% endif %}"
                            href="/migration"
                        >
                            Migration
                        </a>

                    </li>

                </ul>

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item dropdown">

                        <a
                            class="nav-link dropdown-toggle{% if active_page == "about" %} active{% endif %}"
                            href="#"
                            role="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                        >
                            App
                        </a>

                        <ul
                            class="dropdown-menu dropdown-menu-end"
                        >

                            <li>

                                <a
                                    class="dropdown-item{% if active_page == "about" %} active{% endif %}"
                                    href="/about"
                                >
                                    <i class="bi bi-info-circle me-2"></i>
                                    About
                                </a>

                            </li>

                        </ul>

                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Global application alerts -->
    {% include "partials/alerts.html" %}

    <!-- Page content -->
    <main class="container-fluid py-4 flex-grow-1">

        {% block content %}
        {% endblock %}

    </main>

    <!-- Global application status -->
    {% include "partials/status.html" %}

    <!-- HTMX -->
    <script
        src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
    ></script>

    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
